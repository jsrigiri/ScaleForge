apiVersion: batch/v1
kind: Job
metadata:
  name: scaleforge-train
  namespace: scaleforge

spec:
  template:
    spec:

      restartPolicy: Never

      containers:
        - name: trainer

          image: scaleforge:latest

          imagePullPolicy: Never

          volumeMounts:
            - name: training-storage
              mountPath: /app/checkpoints

      volumes:
        - name: training-storage

          persistentVolumeClaim:
            claimName: scaleforge-pvc

  backoffLimit: 0