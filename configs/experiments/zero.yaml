project:
  name: ScaleForge
  seed: 42

data:
  data_dir: data
  num_shards: 4
  records_per_shard: 100
  seq_len: 32
  vocab_size: 128
  streaming: true

model:
  vocab_size: 128
  embed_dim: 64
  hidden_dim: 128
  num_classes: 2

training:
  batch_size: 8
  max_steps: 60
  learning_rate: 0.001
  checkpoint_every_steps: 10
  fail_after_steps: null

distributed:
  backend: gloo

paths:
  checkpoint_dir: checkpoints
  metrics_dir: metrics

experiment:
  run_name: zero_ddp_streaming_bs8

fsdp:
  enabled: false

zero:
  enabled: true